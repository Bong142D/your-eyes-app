version: '3.8'

services:
  ocr-server-service:
    build:
      context: ./ocr-server
      dockerfile: Dockerfile
    container_name: inno_ocr_container
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
    restart: unless-stopped
    volumes:
      - ocr_models:/app/models

  billing-service:
    build:
      context: ./billing
      dockerfile: Dockerfile
    container_name: inno_billing_container
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - BILLING_ENV=dev
    restart: unless-stopped

volumes:
  ocr_models:
